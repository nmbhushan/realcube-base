apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: enterprise-workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.worker.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: platform-api }
  template:
    metadata:
      labels: { app: platform-api }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "{{ .Values.api.port }}" }
            - { name: OUTBOX_PUBLISHER_ENABLED, value: "false" }
          {{- with .Values.api.envFromSecretName }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: platform-api }
  ports: [{ name: http, port: {{ .Values.api.port }}, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: platform-frontend }
  template:
    metadata:
      labels: { app: platform-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports: [{ name: http, containerPort: {{ .Values.frontend.port }} }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PLATFORM_API_INTERNAL_URL, value: {{ .Values.frontend.apiInternalUrl | quote }} }
            - { name: SESSION_COOKIE_SECURE, value: "{{ .Values.frontend.sessionCookieSecure }}" }
          {{- with .Values.frontend.envFromSecretName }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-outbox-worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app: platform-outbox-worker }
  template:
    metadata:
      labels: { app: platform-outbox-worker }
    spec:
      serviceAccountName: {{ .Values.worker.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: outbox-worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          command: ["node", "dist/outbox/worker.main.js"]
          env:
            - { name: NODE_ENV, value: production }
            - { name: OUTBOX_PUBLISHER_ENABLED, value: "true" }
            - { name: ACCESS_EVENTS_QUEUE_URL, value: {{ .Values.worker.queueUrl | quote }} }
            - { name: OUTBOX_POLL_INTERVAL_MS, value: "{{ .Values.worker.pollIntervalMs }}" }
            - { name: AWS_REGION, value: {{ .Values.awsRegion | quote }} }
          {{- with .Values.worker.envFromSecretName }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
{{- end }}
