apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: enterprise-workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: platform-api }
  template:
    metadata:
      labels: { app: platform-api }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "{{ .Values.api.port }}" }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: platform-api }
  ports: [{ name: http, port: {{ .Values.api.port }}, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: platform-frontend }
  template:
    metadata:
      labels: { app: platform-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports: [{ name: http, containerPort: {{ .Values.frontend.port }} }]
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: platform-frontend }
  ports: [{ name: http, port: {{ .Values.frontend.port }}, targetPort: http }]
