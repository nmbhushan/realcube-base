namespace: enterprise-platform
frontend:
  image:
    repository: REPLACE_WITH_ECR_REPOSITORY/platform-frontend
    tag: "REPLACE_WITH_IMMUTABLE_TAG"
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
api:
  image:
    repository: REPLACE_WITH_ECR_REPOSITORY/platform-api
    tag: "REPLACE_WITH_IMMUTABLE_TAG"
  replicas: 2
  port: 3001
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
serviceAccount:
  name: enterprise-platform
  annotations: {}
ingress:
  enabled: false
  className: alb
  host: platform.example.com
