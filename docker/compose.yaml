services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform_pgdata:/var/lib/postgresql/data
      - ../database/platform/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ../database/platform/002_admin_bootstrap_outbox.sql:/docker-entrypoint-initdb.d/002_admin_bootstrap_outbox.sql:ro
      - ../database/platform/003_platform_admin_workflows.sql:/docker-entrypoint-initdb.d/003_platform_admin_workflows.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workspace} -d ${PLATFORM_DB_NAME:-platform_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
  platform-api:
    build:
      context: ..
      dockerfile: apps/platform-api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?Set PLATFORM_DATABASE_URL in .env}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-enterprise-platform-api}
      PLATFORM_BOOTSTRAP_ENABLED: ${PLATFORM_BOOTSTRAP_ENABLED:-false}
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:-}
      OIDC_PERMISSIONS_CLAIM: ${OIDC_PERMISSIONS_CLAIM:-permissions}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-false}
      ACCESS_EVENTS_QUEUE_URL: ${ACCESS_EVENTS_QUEUE_URL:-}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  platform-web:
    build:
      context: ..
      dockerfile: apps/platform-web/Dockerfile
    environment:
      NODE_ENV: production
      PLATFORM_ENV: ${PLATFORM_ENV:-local}
      PLATFORM_WEB_BASE_URL: ${PLATFORM_WEB_BASE_URL:-http://localhost:3000}
      PLATFORM_API_INTERNAL_URL: http://platform-api:3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-x-real-ip}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile offline_access}
      OIDC_RESOURCE: ${OIDC_RESOURCE:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      platform-api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
  pims-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PIMS_POSTGRES_ADMIN_PASSWORD:?Set PIMS_POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: pims_db
      PIMS_APP_DB_PASSWORD: ${PIMS_APP_DB_PASSWORD:?Set PIMS_APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PIMS_DB_PORT:-5433}:5432"
    volumes:
      - pims_pgdata:/var/lib/postgresql/data
      - ../database/pims/000-create-app-role.sh:/docker-entrypoint-initdb.d/000-create-app-role.sh:ro
      - ../database/pims/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pims_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  pims-api:
    build:
      context: ..
      dockerfile: apps/pims-api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3002
      PIMS_DATABASE_URL: postgresql://pims_app:${PIMS_APP_DB_PASSWORD:?Set PIMS_APP_DB_PASSWORD in .env}@pims-postgres:5432/pims_db
      PIMS_DATABASE_SSL: ${PIMS_DATABASE_SSL:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      PIMS_OIDC_AUDIENCE: ${PIMS_OIDC_AUDIENCE:-pims-api}
      PIMS_MAX_TOKEN_AGE_SECONDS: ${PIMS_MAX_TOKEN_AGE_SECONDS:-300}
      PIMS_PERMISSIONS_CLAIM: ${PIMS_PERMISSIONS_CLAIM:-permissions}
    ports:
      - "127.0.0.1:${PIMS_API_PORT:-3002}:3002"
    depends_on:
      pims-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  platform_pgdata:
  pims_pgdata:
