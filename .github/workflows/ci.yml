name: Starter CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  build-and-test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: postgres-test-password
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql://workspace:postgres-test-password@localhost:5432/platform_test
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --testPathIgnorePatterns=integration
      - run: npm run test:integration
  build-and-test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:production-config
      - run: npm run build

  helm-chart-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint Helm chart
        run: helm lint infra/helm/platform
      - name: Render pinned AWS Load Balancer Controller chart
        shell: bash
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks
          helm template aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 3.6.2 \
            --namespace kube-system \
            --values infra/helm/aws-load-balancer-controller-values.yaml \
            --set clusterName=realcube-ci \
            --set region=ap-south-1 \
            --set vpcId=vpc-0123456789abcdef0 \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller > /tmp/lbc-rendered.yaml
          grep -q 'serviceAccountName: aws-load-balancer-controller' /tmp/lbc-rendered.yaml
          grep -q 'name: aws-load-balancer-controller' /tmp/lbc-rendered.yaml
      - name: Render and assert production workloads
        shell: bash
        run: |
          helm template enterprise-platform infra/helm/platform \
            --set frontend.image.repository=example.com/realcube/platform-frontend \
            --set frontend.image.tag=ci-test \
            --set api.image.repository=example.com/realcube/platform-api \
            --set api.image.tag=ci-test > /tmp/platform-rendered.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/platform-rendered.yaml
          grep -q 'kind: Service' /tmp/platform-rendered.yaml
          grep -q 'name: platform-frontend' /tmp/platform-rendered.yaml
          grep -q '/api/health/ready' /tmp/platform-rendered.yaml
          grep -q 'maxUnavailable: 0' /tmp/platform-rendered.yaml
          helm template enterprise-platform infra/helm/platform \
            --set frontend.image.repository=example.com/realcube/platform-frontend \
            --set frontend.image.tag=ci-test \
            --set api.image.repository=example.com/realcube/platform-api \
            --set api.image.tag=ci-test \
            --set ingress.enabled=true \
            --set ingress.scheme=internet-facing \
            --set ingress.host=platform.ci.example.com \
            --set ingress.certificateArn=arn:aws:acm:ap-south-1:111111111111:certificate/ci-test \
            --set ingress.wafAclArn=arn:aws:wafv2:ap-south-1:111111111111:regional/webacl/ci-test > /tmp/platform-ingress-rendered.yaml
          grep -q 'kind: Ingress' /tmp/platform-ingress-rendered.yaml
          grep -q 'alb.ingress.kubernetes.io/ssl-redirect' /tmp/platform-ingress-rendered.yaml
          grep -q 'alb.ingress.kubernetes.io/wafv2-acl-arn' /tmp/platform-ingress-rendered.yaml
          if helm template enterprise-platform infra/helm/platform \
            --set frontend.image.repository=example.com/realcube/platform-frontend \
            --set frontend.image.tag=ci-test \
            --set api.image.repository=example.com/realcube/platform-api \
            --set api.image.tag=ci-test \
            --set ingress.enabled=true \
            --set ingress.scheme=internet-facing \
            --set ingress.host=platform.ci.example.com \
            --set ingress.certificateArn=arn:aws:acm:ap-south-1:111111111111:certificate/ci-test >/dev/null 2>&1; then
            echo "Expected internet-facing ingress without WAF to fail template validation"
            exit 1
          fi
      - name: Validate release script syntax
        run: bash -n scripts/deploy-platform.sh
      - name: Verify immutable digest image rendering
        shell: bash
        run: |
          IMAGE_DIGEST=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template enterprise-platform infra/helm/platform \
            --set-string frontend.image.repository=example.com/realcube/platform-frontend \
            --set-string frontend.image.digest="${IMAGE_DIGEST}" \
            --set-string frontend.image.tag= \
            --set-string api.image.repository=example.com/realcube/platform-api \
            --set-string api.image.digest="${IMAGE_DIGEST}" \
            --set-string api.image.tag= \
            --set worker.enabled=true \
            --set-string worker.image.repository=example.com/realcube/platform-worker \
            --set-string worker.image.digest="${IMAGE_DIGEST}" \
            --set-string worker.image.tag= > /tmp/platform-digest-rendered.yaml
          grep -Fq "image: \"example.com/realcube/platform-api@${IMAGE_DIGEST}\"" /tmp/platform-digest-rendered.yaml
          grep -Fq "image: \"example.com/realcube/platform-frontend@${IMAGE_DIGEST}\"" /tmp/platform-digest-rendered.yaml
          grep -Fq "image: \"example.com/realcube/platform-worker@${IMAGE_DIGEST}\"" /tmp/platform-digest-rendered.yaml

  terraform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive infra/terraform
      - name: Initialize state bootstrap root without backend
        run: terraform -chdir=infra/terraform/bootstrap-state init -backend=false
      - name: Validate state bootstrap configuration
        run: terraform -chdir=infra/terraform/bootstrap-state validate
      - name: Initialize development root without backend
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false
      - name: Validate development configuration
        run: terraform -chdir=infra/terraform/environments/dev validate
